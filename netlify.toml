# Site estático. O build copia para dist/ só o que o navegador usa e grava ali
# js/registro-config.js com o Supabase do ambiente (variáveis SUPABASE_URL,
# SUPABASE_ANON_KEY, ADMIN_EMAIL definidas em cada site).
#   produção → site treinamentofinanceirobigou, branch main  → Supabase onboarding-guiado
#   stage    → site ondoarding-guiado-stage,    branch stage → Supabase onboard-guiado-stage
[build]
  command = "node scripts/build.js"
  publish = "dist"

# A URL e a chave anon do Supabase vão para o navegador de propósito (a segurança
# vem das regras RLS), então a varredura de segredos da Netlify ignora só essas duas.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

# Cabeçalhos de segurança em todas as páginas.
# CSP: só scripts do próprio site; estilos inline são usados nos templates;
# fontes do Google Fonts; API só do Supabase; o site não pode ser embutido em iframe.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Painel admin: não indexar.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
